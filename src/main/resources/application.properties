# General
spring.application.name=classroom-booking-service-2
server.port=9000
server.servlet.context-path=/classroom-booking
logging.level.dev.jcasaslopez=
frontend.url=${FRONTEND_URL}

spring.jackson.deserialization.adjust-dates-to-context-time-zone=true

# Environment variables (topics are shared among different micro-services)
kafka.topic.name.notifications=${KAFKA_TOPIC_NOTIFICATIONS}
kafka.topic.name.classrooms=${KAFKA_TOPIC_CLASSROOMS}
jwt.secretKey=${JWT_SECRETKEY}

# Database-ralated
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.url=jdbc:mysql://localhost:3306/classroom_bookings
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_ROOT_USERNAME}
spring.datasource.password=${DB_ROOT_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# Micro-service settings
opening-times.monday=${OPENING_TIMES_MONDAY:9:00-22:00}
opening-times.tuesday=${OPENING_TIMES_TUESDAY:9:00-22:00}
opening-times.wednesday=${OPENING_TIMES_WEDNESDAY:9:00-22:00}
opening-times.thursday=${OPENING_TIMES_THURSDAY:9:00-22:00}
opening-times.friday=${OPENING_TIMES_FRIDAY:9:00-22:00}
opening-times.saturday=${OPENING_TIMES_SATURDAY:CLOSED}
opening-times.sunday=${OPENING_TIMES_SUNDAY:CLOSED}

time-slot.duration=${TIME_SLOT_DURATION:30}
booking.maximum-duration=${BOOKING_MAX_DURATION:120}
booking.maximum-number-per-week=${BOOKING_MAX_PER_WEEK:3}

# Kafka-related
spring.kafka.bootstrap-servers=127.0.0.1:9092
spring.kafka.listener.observation-enabled=true

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=dev.jcasaslopez.classroom.shared.event.ClassroomEvent
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=classroom-booking-service

spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.retries=2147483647
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5